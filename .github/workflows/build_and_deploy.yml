name: Build and Deploy

on:
  push:
    branches:
      - master
      - stage
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip the build step and use the artifact from the last successful build (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.skip_build != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build strfry
        run: |
          sudo apt update && sudo apt install -y git g++ make pkg-config libtool \
          libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev \
          libsecp256k1-dev libzstd-dev
          git submodule update --init
          make setup-golpe
          make -j4
          if ! [ -f ./strfry ]; then
             echo "Strfry build failed."
             exit 1
          fi

      - name: Package Debian (.deb)
        id: package
        run: |
          sudo apt-get install debhelper devscripts -y
          dpkg-buildpackage --build=binary -us -uc
          mv ../*.deb .
          filename=$(ls *.deb | grep -v -- -dbgsym)
          echo "filename=${filename}" >> $GITHUB_OUTPUT  # 使用 GITHUB_OUTPUT 设置输出变量

      - name: Upload strfry deb to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.package.outputs.filename }}
          tag: ${{ github.ref == 'refs/heads/master' && 'latest' || 'stage-latest' }}  # master 对应正式版本，stage 对应测试版本
          name: ${{ github.ref == 'refs/heads/master' && 'Production Build' || 'Stage Build' }}
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/master' && 'false' || 'true' }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine Environment
        id: environment
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "environment=production" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/stage" ]; then
            echo "environment=stage" >> $GITHUB_ENV
          else
            echo "Unknown branch: ${{ github.ref }}"
            exit 1

      - name: Download strfry deb from GitHub Release
        run: |
          GITHUB_API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.environment }}-latest"
          AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
          ASSET_ID=$(curl -s -H "$AUTH_HEADER" $GITHUB_API_URL | jq -r '.assets[] | select(.name | test("\\.deb$")) | .id')
          if [ -z "$ASSET_ID" ]; then
            echo "No .deb asset found in the latest release."
            exit 1
          fi
          curl -L -H "$AUTH_HEADER" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID" \
            -o strfry.deb

      - name: Deploy to AWS Server (Production)
        if: env.environment == 'production'
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.AWS_SERVER_IP }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SERVER_SSH_KEY }}
          source: ./strfry.deb
          target: /tmp

      - name: Install and Start on AWS Server (Production)
        if: env.environment == 'production'
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AWS_SERVER_IP }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SERVER_SSH_KEY }}
          script: |
            sudo dpkg -i /tmp/strfry.deb
            sudo systemctl restart strfry

      - name: Deploy to Ali Server
        if: env.environment == 'production'
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.ALI_SERVER_IP }}
          username: ${{ secrets.ALI_SERVER_USER }}
          key: ${{ secrets.ALI_SERVER_SSH_KEY }}
          source: ./strfry.deb
          target: /tmp

      - name: Install and Start on Ali Server
        if: env.environment == 'production'
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.ALI_SERVER_IP }}
          username: ${{ secrets.ALI_SERVER_USER }}
          key: ${{ secrets.ALI_SERVER_SSH_KEY }}
          script: |
            sudo dpkg -i /tmp/strfry.deb
            sudo systemctl restart strfry

      - name: Deploy to AWS Server (Stage)
        if: env.environment == 'stage'
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.AWS_STAGE_SERVER_IP }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SERVER_SSH_KEY }}
          source: ./strfry.deb
          target: /tmp

      - name: Install and Start on AWS Server (Stage)
        if: env.environment == 'stage'
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AWS_STAGE_SERVER_IP }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SERVER_SSH_KEY }}
          script: |
            sudo dpkg -i /tmp/strfry.deb
            sudo systemctl restart strfry
