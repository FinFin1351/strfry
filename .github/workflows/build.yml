name: build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Build strfry
        run: |
          sudo apt update && sudo apt install -y git g++ make pkg-config libtool \
          libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev \
          libsecp256k1-dev libzstd-dev
          git submodule update --init
          make setup-golpe
          make -j4
          if ! [ -f ./strfry ]; then
             echo "Strfry build failed."
             exit 1
          fi

      - name: Package Debian (.deb)
        run: |
          sudo apt-get install debhelper devscripts -y
          dpkg-buildpackage --build=binary -us -uc
          mv ../*.deb .
          filename=`ls *.deb | grep -v -- -dbgsym`
          echo "filename=$filename" >> $GITHUB_ENV

      - name: Upload strfry deb
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.filename }}
          path: ${{ env.filename }}
